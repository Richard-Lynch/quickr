[project]
name = "quickr-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.0",
    "fastmcp>=4.1.3",
    "httpx[http2]>=0.28.1",
    "py-vapid>=1.9",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyjwt[crypto]>=2.15.1",
    "pywebpush>=2.5",
    "sqlalchemy[asyncio]>=2.1.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.17.2",
    "types-requests>=2.33.0.20261006",
]
notebook = [
    "httpx>=0.28.1",
    "jupyterlab>=4.6.4",
    "pandas>=3.1.0",
]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PL", "PT", "TC", "C4", "PIE", "RET", "ARG"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0911", "TC001", "TC002", "TC003", "RUF012", "PLR0917", "PLC0415", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "ARG"]
"alembic/**" = ["N999", "E501"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
warn_unreachable = true
disallow_any_explicit = false
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
module = ["pywebpush", "pywebpush.*", "py_vapid", "py_vapid.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# A hang (e.g. a push job waiting on a send that never happens) fails its test instead of
# stalling the run; the slowest tests take a few seconds.
timeout = 60

[tool.uv]
package = false
