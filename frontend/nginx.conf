# Rendered by the nginx image's envsubst step (/etc/nginx/templates/*.template).
# Only variables defined in the environment are substituted:
#   BACKEND_ORIGIN  (default http://backend:8000 — the compose service)
#   NGINX_RESOLVER  (default 127.0.0.11 — Docker's embedded DNS)

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend per request so nginx starts (and recovers) even if
    # the backend container is not up yet or gets a new IP.
    resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
    set $backend ${BACKEND_ORIGIN};

    client_max_body_size 5m;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/csv application/json application/javascript
               text/javascript application/xml image/svg+xml application/manifest+json;

    # --- API --------------------------------------------------------------
    location /api/ {
        proxy_pass $backend;   # no URI part: the original path is passed through
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- MCP (streamable HTTP: responses may be SSE streams) ----------------
    # Matches /mcp and /mcp/...; /mcp/ is forwarded as /mcp/ unchanged.
    location /mcp {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # --- SPA ----------------------------------------------------------------
    # Vite emits content-hashed files under /assets: cache them forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # History-API fallback for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }
}
