# MobileBuildMCP (formerly XcodeBuildMCP) project config. See docs/ios/PLAN.md §8.
# The `make ios-*` targets stay the canonical, reproducible build path (CI and sub-agents).
# This MCP is the interactive loop: build, run, see the screen, fix.
schemaVersion: 1
enabledWorkflows:
  - simulator             # build/run/test on simulator
  - simulator-management  # boot, appearance, status bar, location
  - ui-automation         # tap/swipe/type/describe UI, screenshots (bundled AXe)
  - swift-package         # swift build/test for swift-ui/QuickrKit
  - debugging             # LLDB attach
  - xcode-ide             # proxy to Xcode's own MCP (xcrun mcpbridge): previews, docs, diagnostics
  - doctor                # environment diagnostics
  # - device              # enable after Apple enrollment + phone pairing (checkpoint D)
sessionDefaults:
  projectPath: "./swift-ui/quickR.xcodeproj"   # generated by `make ios-gen` (xcodegen)
  scheme: "QuickR"
  simulatorName: "iPhone 17"
sentryDisabled: true
