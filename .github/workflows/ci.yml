name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: quicker
          POSTGRES_PASSWORD: quicker
          POSTGRES_DB: quicker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quicker" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      QUICKER_TEST_DATABASE_URL: postgresql+asyncpg://quicker:quicker@localhost:5432/quicker_test
      QUICKER_DATABASE_URL: postgresql+asyncpg://quicker:quicker@localhost:5432/quicker_test
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Mypy (strict)
        run: uv run mypy app scripts tests
      - name: OpenAPI spec is up to date
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -u ../openapi.json /tmp/openapi.json || (echo "::error::openapi.json is stale - run 'make openapi'" && exit 1)
      - name: Migrations match models
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Tests
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generated client is up to date
        run: |
          pnpm gen:api
          git diff --exit-code -- src/client || (echo "::error::src/client is stale - run 'make client'" && exit 1)
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    name: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build images
        run: docker compose build
      - name: Start stack
        run: docker compose up -d --wait --wait-timeout 180
      - name: Smoke test through the web proxy
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/ | grep -qi '<div id="root"'
          curl -fsS http://localhost:8080/api/v1/health
          curl -fsS -X POST http://localhost:8080/api/v1/topics -H 'content-type: application/json' \
            -d '{"name":"Smoke","questions":[{"type":"int","key":"n","label":"N","min":0,"max":10}]}'
          curl -fsS -X POST http://localhost:8080/api/v1/topics/smoke/sessions -H 'content-type: application/json' \
            -d '{"answers":{"n":3}}'
          curl -fsS http://localhost:8080/api/v1/topics/smoke/stats | grep -q '"session_count":1'
          curl -fsS -X POST http://localhost:8080/mcp/ -H 'content-type: application/json' \
            -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | grep -q '"serverInfo"'
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
