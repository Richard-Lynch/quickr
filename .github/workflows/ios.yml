name: iOS

# - `swift test` for ios/QuickrKit on the host, and `make ios-check-ci` (xcodegen, then build +
#   the Unit plan on an iOS 26.x simulator, no signing).
# - A push (main, feat/ios-app) or a manual dispatch runs both, always: a push's `ios gate`
#   certifies its commit for a v* tag's deploy, so it never skips on a diff.
# - A non-draft PR (opened, ready for review, new commits) runs them only when it touches the
#   iOS paths (the `ios changes` job decides); the Makefile is in the paths because it is the
#   build interface CI calls.
# `ios gate` is the one check to require: it fails unless the path check succeeded and both
# jobs passed or were skipped by it (a workflow-level path filter would leave a required check
# pending, and a skipped required job would count as passing on its own).
on:
  # No path filter: every commit on these branches gets an `ios gate`.
  push:
    branches: [main, feat/ios-app]
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:

# A push to main is never cancelled: each of its commits needs its own `ios gate` (a v* tag
# deploys only from a commit whose gates passed).
concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name == 'push' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned so CI matches a known toolchain. Local development uses Xcode 27.x; the code
  # sticks to iOS 26 APIs so both build it (PLAN §2). Switch to the `xcode-27` runner image
  # (and its Xcode 27.x path) once GitHub makes it generally available.
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
  XCODEGEN_VERSION: 2.46.0
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  changes:
    name: ios changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # A PR checks out its merge commit, so HEAD^1 is the base it merges into. A push or a
      # dispatch runs everything: a push's gate certifies its commit for a v* tag's deploy, so it
      # never skips on a diff (a skip would carry a red gate on the previous commit forward).
      - id: diff
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then echo "ios=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          echo "$changed"
          if grep -qE '^(ios/|shared/fixtures/|Makefile$|\.github/workflows/ios\.yml$)' <<< "$changed"; then
            echo "ios=true" >> "$GITHUB_OUTPUT"
          else
            echo "ios=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    name: swift test
    needs: changes
    if: >-
      needs.changes.outputs.ios == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain identity
        id: toolchain
        timeout-minutes: 2
        run: |
          xcodebuild -version && swift --version
          echo "hash=$( (xcodebuild -version; swift --version 2>&1) | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      # .build holds compiled products, so the key includes the architecture and the toolchain.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/QuickrKit/.build
          key: spm-host-${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.hash }}-${{ hashFiles('ios/QuickrKit/Package.swift', 'ios/**/Package.resolved') }}
      - name: Script tests (watchdog, simulator cap)
        timeout-minutes: 5
        run: make ios-script-test
      # The job's 15 min is the outer bound; these fail a hung `swift test` sooner. The tests run
      # with a strict (one-thread) cooperative pool, so a test that blocks a pool thread hangs
      # here, where it is cheap to see, as it would on the 3-core runner (swift-test.sh). The
      # real-time tests skip there and run next, alone and one at a time (timing-test.sh).
      - name: Swift tests
        timeout-minutes: 8
        run: ios/scripts/swift-test.sh
      - name: Real-time tests (TimingTests, MultiProcessTests)
        timeout-minutes: 8
        run: ios/scripts/timing-test.sh
      # GRDB's suspension is process-wide, so these run in a swift test process of their own.
      - name: Lifecycle tests (GRDB suspension)
        timeout-minutes: 5
        run: QUICKR_LIFECYCLE_TESTS=1 ios/scripts/swift-test.sh --filter QuickrLifecycleTests --no-parallel

  app:
    name: build + Unit plan
    needs: changes
    if: >-
      needs.changes.outputs.ios == 'true' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install xcodegen ${{ env.XCODEGEN_VERSION }}
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/build/spm
          key: spm-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ios/QuickrKit/Package.swift', 'ios/**/Package.resolved') }}
      - run: xcodebuild -version && xcodegen --version
        timeout-minutes: 2
      - name: Script tests (watchdog, simulator cap)
        timeout-minutes: 5
        run: make ios-script-test
      # Fails unless an iPhone simulator on an iOS 26.x runtime exists (PLAN §6a rule 12).
      # Healthy: ~2 min to build, ~1 min to boot and install, 1–2 min of tests. xcodebuild prints
      # all along, so 5 silent minutes is a hang (a cold package fetch still gets 40, common.sh).
      - name: Build + Unit plan (no signing)
        timeout-minutes: 15
        env:
          IOS_WATCHDOG_SILENCE_MIN: 5
        run: make ios-check-ci IOS_SIM_CI="iPhone 17"
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-xcresult
          path: ios/build/results
          retention-days: 7

  ios:
    name: ios gate
    if: always()
    needs: [changes, package, app]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A run whose event says draft skips the slow jobs, so it certifies nothing: fail it rather
      # than pass on skips. (A draft-time run can land after `ready_for_review` and cancel it.)
      - env:
          NEEDS: ${{ toJSON(needs) }}
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          if os.environ["DRAFT"] == "true":
              print(f"::error title=ios::draft PR: nothing certified; re-run once it is ready for review")
              sys.exit(1)
          results = {job: v["result"] for job, v in json.loads(os.environ["NEEDS"]).items()}
          print(results)
          bad = {j: r for j, r in results.items() if r != "success" and not (r == "skipped" and j != "changes")}
          if bad:
              print(f"::error title=ios::not passed: {bad}")
              sys.exit(1)
          PY
